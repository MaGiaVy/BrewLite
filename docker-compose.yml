services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brewlite}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: brewlite_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-brewlite}?schema=public
      JWT_SECRET: ${JWT_SECRET:-brewlite-super-secret-jwt-key-change-in-prod}
      PORT: ${PORT:-3001}
      ALLOW_SANDBOX_CONFIRM: ${ALLOW_SANDBOX_CONFIRM:-false}
      ZALOPAY_APP_ID: '${ZALOPAY_APP_ID:-2554}'
      ZALOPAY_KEY1: '${ZALOPAY_KEY1:-sdngKKJmqEMzvh5QQcdD2A9XBSKUNaYn}'
      ZALOPAY_KEY2: '${ZALOPAY_KEY2:-trMrHtvjo6myautxDUiAcYsVtaeQ8nhf}'
      ZALOPAY_CREATE_ENDPOINT: '${ZALOPAY_CREATE_ENDPOINT:-https://sb-openapi.zalopay.vn/v2/create}'
      ZALOPAY_QUERY_ENDPOINT: '${ZALOPAY_QUERY_ENDPOINT:-https://sb-openapi.zalopay.vn/v2/query}'
      ZALOPAY_CALLBACK_URL: '${ZALOPAY_CALLBACK_URL:-http://localhost:3001/payments/zalopay/callback}'
    ports:
      - '${PORT:-3001}:3001'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: brewlite_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  postgres_data:
